# TrueNAS 25.10 / 27: Apps > Discover Apps > … > Install via YAML.
# Replace host_ip and the three host paths. Create dedicated ZFS datasets first.
# Root + DAC_READ_SEARCH can open inode handles anywhere on a bind source filesystem,
# even outside a mounted folder. This also applies to Restic file backups.
# /data, sources and restore should each be a dataset root, never shared plain folders.
# Never bind any part of <pool>/buddy-zfs-control into this app.
services:
  buddybackup:
    image: ghcr.io/engineeringdn/buddybackup:0.2.0@sha256:fbac159ca2f3f081ac50e03e8201b2791e4c3b468cfba5fc0dde035cf187b5df
    restart: unless-stopped
    user: '0:0'
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      # Required to preserve source UID/GID/mode/ACL metadata during restore.
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    ports:
      - target: 8080
        published: '8080'
        host_ip: 192.168.1.10
        protocol: tcp
      # ZFS outbound SSH: host loopback only; never publish on a LAN IP.
      - target: 2288
        published: '2288'
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      BUDDY_LISTEN: 0.0.0.0:8080
      # Optional: exact NAS DNS hostname; IP access works without this.
      # BUDDY_UI_HOST: nas.home.arpa
      # BUDDY_COOKIE_SECURE: '1' # only when serving behind LAN HTTPS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    volumes:
      - type: bind
        source: /mnt/tank/buddybackup
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/tank/photos
        target: /sources/photos
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/tank/restore
        target: /restore
        bind:
          create_host_path: false
    # host-gateway denotes Docker's default bridge. Use that same bridge so
    # host.docker.internal and the verified default-route gateway agree.
    network_mode: bridge
